<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>死後裁きに合うみくじ</title>

<style>
:root{
  --bg:#f5f5f5;
  --text:#222;
  --card:#ffffff;
  --border:#dddddd;
  --fortune:#cc0000;
  --sub:#666666;
  --button:#aa0000;
  --button-hover:#cc2222;
}

body.dark{
  --bg:#000;
  --text:#f5f5f5;
  --card:#1c1c1c;
  --border:#aa0000;
  --fortune:#ff4444;
  --sub:#bbbbbb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  min-height:100vh;

  text-align:center;
  font-family:"Yu Gothic",system-ui,sans-serif;

  background:var(--bg);
  color:var(--text);

  transition:.3s;
}

.topbar{
  max-width:700px;
  margin:0 auto 15px;
  display:flex;
  justify-content:flex-end;
}

.theme-btn{
  background:#fff;
  color:#444;
  border:1px solid #ddd;
  border-radius:999px;
  padding:10px 16px;
  font-size:0.9rem;

  -webkit-tap-highlight-color: transparent;
  appearance:none;
  -webkit-appearance:none;

  transition:
    background .2s,
    color .2s,
    border-color .2s;
}

.logo{
  width:100%;
  max-width:650px;
  height:auto;
  display:block;
  margin:0 auto 25px;
}

.box{
  background:transparent;
  border:none;

  max-width:700px;
  width:90%;

  margin:0 auto;

  padding:20px;

  box-shadow:none;
}

h1,
.subtitle,
#fortune,
#judgment{
  font-family:"Zen Old Mincho", serif;
}

h1{
  margin-top:0;
  margin-bottom:10px;
  font-size:1.6rem;
}

.subtitle{
  font-family:"Zen Old Mincho",serif;
  font-size:1.3rem;
  letter-spacing:.2em;
  margin-bottom:15px;
  color:var(--text);
}
#fortune{
  font-size:5rem;
  font-weight:bold;
  color:var(--fortune);

  margin:30px 0 20px;

  text-shadow:
    0 0 10px rgba(255,0,0,.4),
    0 0 20px rgba(255,0,0,.3);
}

#judgment{
  font-size:1.1rem;
  line-height:1.7;
  margin-bottom:10px;
  min-height:70px;
}

.draw-btn{
  background:var(--button);
  color:#fff;
  border:none;
  padding:14px 32px;
  font-size:1.1rem;
  border-radius:6px;
  cursor:pointer;
}

.draw-btn:hover{
  background:var(--button-hover);
}

@media (max-width:480px){

  .logo{
    max-width:100%;
  }

  h1{
    font-size:1.5rem;
  }

  .subtitle{
   font-size:1.2rem;
   letter-spacing:.0em;
   white-space:nowrap;
  }

  #fortune{
    font-size:3rem;
  }

  #judgment{
    font-size:1.1rem;
  }

  .draw-btn{
    width:90%;
    max-width:320px;
  }
}

/* 天国モード */
.theme-btn:hover{
  background:#e5e5e5;
}

/* 地獄モード */

body.dark .theme-btn{
  background:#1c1c1c;
  color:#ff6666;
  border:1px solid #aa0000;
}

body.dark .theme-btn:hover{
  background:#550000;
}

</style>
</head>

<body>

<div class="topbar">
  <button class="theme-btn" onclick="toggleTheme()">
    💀 地獄モード
  </button>
</div>

<img
  id="logo"
  class="logo"
  src="banner-white.jpg"
  alt="死後裁きサバイバル"
>

<div class="box">

  <!-- <h1>死後裁きに合うみくじ</h1> -->

  <div class="subtitle">
    ― 本日のあなたの裁きレベルは ―
  </div>

  <div id="fortune">？</div>

  <div id="judgment">
    今日の裁き
  </div>

  <button class="draw-btn" onclick="drawJudgment()">
    裁きを受ける
  </button>

</div>

<script src="judgments.js"></script>

<script>

const fortunes = Object.keys(data);

function drawJudgment(){

  const fortune =
    fortunes[Math.floor(Math.random() * fortunes.length)];

  const judgments = data[fortune];

  const judgment =
    judgments[Math.floor(Math.random() * judgments.length)];

  document.getElementById("fortune").textContent = fortune;
  
    document.getElementById("judgment").textContent = judgment;
}

function applyTheme(theme){

  const logo =
    document.getElementById("logo");

  const button =
    document.querySelector(".theme-btn");

  if(theme === "dark"){

    document.body.classList.add("dark");

    logo.src = "banner-black.jpg";

    button.textContent = "😇 天国モード";

  }else{

    document.body.classList.remove("dark");

    logo.src = "banner-white.jpg";

    button.textContent = "💀 地獄モード";

  }

  localStorage.setItem("theme", theme);
}

function toggleTheme(){

  if(document.body.classList.contains("dark")){
    applyTheme("light");
  }else{
    applyTheme("dark");
  }
}

applyTheme(
  localStorage.getItem("theme") || "light"
);

</script>

</body>
</html>
